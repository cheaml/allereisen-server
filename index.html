</div>
<header class="topbar">
<a class="brand" href="#home">
  <span>AlleReisen</span></a>
<div class="trip-label" id="headerTitle">ALLEREISEN</div>
<nav class="main-menu" aria-label="Hauptnavigation">
<button class="header-menu-button" id="archiveMenu" type="button">ALLE REISEN</button>

</nav>

<main id="app" aria-live="polite">
  <p class="app-loading">Reisearchiv wird geladen …</p>
</main>
<dialog id="loginDialog">
<form method="dialog" class="dialog-card" id="loginForm">
<button class="close" value="cancel">×</button>
<p class="eyebrow">ANMELDEN</p>
<h2>Willkommen zurück</h2>
<label id="registerName" hidden>Name <input id="loginName" type="text" autocomplete="name"></label>
<label>E-Mail-Adresse <input id="loginEmail" type="email" autocomplete="email" required></label>
<label>Passwort <input id="loginPassword" type="password" autocomplete="current-password" required></label>
<button class="primary" value="default">ANMELDEN</button>
<button class="edit-link" type="button" id="showRegister">KONTO ERSTELLEN</button>
<a class="edit-link" href="./api/login.php">MIT MICROSOFT ANMELDEN</a>
<p class="connection-note" id="loginNote"></p>
</form>
</dialog>
<template id="homeTemplate">
<section class="home-page">
<div class="home-hero">
<p class="eyebrow">DEIN REISEARCHIV</p>
<h1>Orte bleiben.<br>
<em>Momente auch.</em>
</h1>
<p class="lede" id="homeIntro">Erstelle Reisedokus aus deinen OneDrive-Aufnahmen. Family on the road ordnet Fotos und Videos nach Ort und Zeit zu einer begehbaren Route.</p>
<a class="web-app-install" href="./installieren.html">Auf iPhone oder iPad installieren ↗</a>
<button class="edit-link home-intro-edit" id="editHomeIntro">STARTSEITENTEXT BEARBEITEN</button>
<a class="primary login-button" id="loginButton" href="./login.html">ANMELDEN</a>
<button class="primary create-button" id="createTrip">＋ NEUE REISEDOKU IMPORTIEREN</button>
</div>
<div class="library">
<div class="library-head">
<div>
<p class="eyebrow">REISEDOKUS</p>
<h2>Deine Geschichten</h2>
</div>
<span id="tripCount" class="media-count">
</span>
</div>
<div class="trip-grid" id="tripGrid">
</div>
</div>
</section>
</template>
<template id="importTemplate">
<section class="import-page">
<button class="back" id="cancelImport">← ZURÜCK ZUM ARCHIV</button>
<div class="import-head">
<p class="eyebrow">NEUE REISEDOKU</p>
<h1>Importiere deine<br>
<em>Erinnerungen.</em>
</h1>
<p class="lede">Family on the road analysiert alle Fotos und Videos in deinem OneDrive-Ordner – einschließlich aller Unterordner – nach Aufnahmezeit, Standort und Medientyp und gruppiert die Reise automatisch in Stationen.</p>
</div>
<div class="import-layout">
<section class="import-card">
<div class="step-label">01 · QUELLE</div>
<label>Reisetitel <input id="newTripTitle" placeholder="z. B. Portugal im September">
</label>
<label>OneDrive-Ordnerpfad <input id="importFolder" placeholder="Reisen/Portugal 2026">
</label>
<label>Microsoft Graph Zugriffstoken <input id="graphToken" type="password" placeholder="Optional: Token für Live-Import">
</label>
<p class="hint">Mit Zugriffstoken liest Family on the road den Ordner über Microsoft Graph aus. Ohne Token wird eine Reisedoku mit Beispielstationen erstellt, die du anschließend bearbeiten kannst.</p>
<button class="primary" id="startImport">ORDNER ANALYSIEREN</button>
</section>
<aside class="import-info">
<p class="eyebrow">WAS WIRD ERKANNT?</p>
<div>
<b>01</b>
<p>Aufnahmezeit und Datum aus Foto- und Video-Metadaten</p>
</div>
<div>
<b>02</b>
<p>GPS-Koordinaten, Ortsnamen und Reiseabschnitte</p>
</div>
<div>
<b>03</b>
<p>Vermutete Verkehrsmittel zwischen den Stationen</p>
</div>
</aside>
</div>
<div class="progress-box" id="progressBox" hidden>
<span class="spinner">
</span>
<div>
<b id="progressTitle">Ordner wird analysiert …</b>
<p id="progressText">Metadaten werden ausgelesen</p>
</div>
</div>
</section>
</template>

<section class="map-page">

<p class="lede">Die Bilder, Orte und Zeiten dieser Reise erzählen ihre Geschichte.</p>
